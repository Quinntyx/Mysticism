plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
    mods {
        mysticism {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Ladysnake Releases'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'org.ladysnake.cardinal-components-api'
            includeGroup 'org.ladysnake'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Loom nests these jars in the remapped production artifact; no fat/dev jar.
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake:satin:${project.satin_version}"
    include "org.ladysnake:satin:${project.satin_version}"

    // Pinned llama.cpp JNI/CPU runtime (Nomic v2 MoE support, bundled tokenizer).
    // Minecraft already supplies SLF4J; never nest another logging API/provider.
    implementation("net.ladenthin:llama:${project.llama_version}") {
        exclude group: 'org.slf4j'
    }
    include("net.ladenthin:llama:${project.llama_version}") { transitive = false }
    ['jackson-core', 'jackson-databind'].each { artifact ->
        implementation "com.fasterxml.jackson.core:${artifact}:${project.jackson_version}"
        include "com.fasterxml.jackson.core:${artifact}:${project.jackson_version}"
    }
    implementation "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
    include "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
    implementation "org.jspecify:jspecify:${project.jspecify_version}"
    include "org.jspecify:jspecify:${project.jspecify_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from('LICENSE.txt') {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
    exclude '**/.DS_Store'
}

apply from: 'scripts/selftest.gradle'

// Loom replaces the Java publication's dev artifact with remapJar.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
