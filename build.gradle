plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Resolve provisioned resources relative to the Gradle project exactly once. Generated
// IntelliJ launches use run/ as their cwd, not the checkout; never pass a relative model path.
// No runtime/model downloads or external-service launch tasks are introduced here.
def embeddedPaths = [
        'mysticism.embedding.bundle': 'mysticismEmbeddingBundle',
        'mysticism.embedding.modelPath': 'mysticismEmbeddingModelPath',
        'mysticism.embedding.resourceCache': 'mysticismEmbeddingResourceCache'
].collectEntries { systemProperty, gradleProperty ->
    [(systemProperty): providers.gradleProperty(gradleProperty)
            .map { file(it).absoluteFile.toPath().normalize().toString() }]
}
def embeddedOptions = [
        'mysticism.embedding.download': 'mysticismEmbeddingDownload',
        'mysticism.embedding.preparationDeadlineMillis': 'mysticismEmbeddingPreparationDeadlineMillis',
        'mysticism.embedding.nativeThreads': 'mysticismEmbeddingNativeThreads'
].collectEntries { systemProperty, gradleProperty ->
    [(systemProperty): providers.gradleProperty(gradleProperty)]
}
def embeddedLaunchArguments = {
    (embeddedPaths + embeddedOptions).findAll { key, value -> value.isPresent() }
            .collect { key, value -> "-D${key}=${value.get()}".toString() }
}

loom {
    splitEnvironmentSourceSets()
    runs {
        configureEach {
            // Data generation inherits client arguments; adding to it again duplicates JVM properties.
            if (name in ['client', 'server']) {
                embeddedLaunchArguments().each { vmArg it }
            }
        }
    }
    mods {
        mysticism {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Ladysnake Releases'
        url = 'https://maven.ladysnake.org/releases'
        content {
            includeGroup 'org.ladysnake.cardinal-components-api'
            includeGroup 'org.ladysnake'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Loom nests these jars in the remapped production artifact; no fat/dev jar.
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake:satin:${project.satin_version}"
    include "org.ladysnake:satin:${project.satin_version}"

    // The same real JNI runtime is on IntelliJ/Loom's classpath AND nested in production.
    // Minecraft supplies SLF4J; never ship a duplicate logging API/provider.
    implementation("net.ladenthin:llama:${project.llama_version}") {
        exclude group: 'org.slf4j'
        exclude group: 'ch.qos.logback'
    }
    include("net.ladenthin:llama:${project.llama_version}") { transitive = false }
    ['jackson-core', 'jackson-databind'].each { artifact ->
        implementation "com.fasterxml.jackson.core:${artifact}:${project.jackson_version}"
        include "com.fasterxml.jackson.core:${artifact}:${project.jackson_version}"
    }
    implementation "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
    include "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
    implementation "org.jspecify:jspecify:${project.jspecify_version}"
    include "org.jspecify:jspecify:${project.jspecify_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

jar {
    from('LICENSE.txt') {
        rename { "LICENSE_${project.archives_base_name}.txt" }
    }
    exclude '**/.DS_Store'
}

apply from: 'scripts/selftest.gradle'

tasks.register('verifyEmbeddedLaunchConfiguration') {
    group = 'verification'
    description = 'Check client/server Loom and generated IntelliJ model/resource/runtime wiring (not inference).'
    doLast {
        loom.runs.each { run ->
            def name = run.name
            def keys = (embeddedPaths + embeddedOptions).keySet()
            def arguments = run.vmArgs.findAll { argument -> keys.any { argument.startsWith("-D${it}=") } }
            def expected = embeddedLaunchArguments()
            if (arguments != expected) throw new GradleException("Incorrect ${name} embedded launch arguments: ${arguments}")
            embeddedPaths.each { key, value ->
                if (value.isPresent() && !new File(value.get()).isAbsolute())
                    throw new GradleException("IDE ${key} path must be absolute")
            }
            // Exercise Loom's actual IntelliJ XML serializer without overwriting user IDE files.
            def config = net.fabricmc.loom.configuration.ide.RunConfig.runConfig(project, run)
            def xml = config.fromDummy('idea_run_config_template.xml', true, project)
            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
            def document = factory.newDocumentBuilder().parse(new org.xml.sax.InputSource(new StringReader(xml)))
            def options = document.getElementsByTagName('option')
            def vm = (0..<options.length).collect { options.item(it) }
                    .find { it.getAttribute('name') == 'VM_PARAMETERS' }.getAttribute('value')
            keys.each { key ->
                def count = expected.count { it.startsWith("-D${key}=") }
                if (vm.count("-D${key}=") != count)
                    throw new GradleException("Incorrect ${name} IntelliJ ${key} properties: ${vm}")
            }
            expected.each { argument ->
                def quoted = argument.any { Character.isWhitespace(it as char) } ? "\"${argument}\"" : argument
                if (!vm.contains(quoted)) throw new GradleException("Incorrect ${name} IntelliJ argument quoting: ${vm}")
            }
        }
        // Production nesting alone does not put a dependency on an IDE runtime classpath.
        def runtime = sourceSets.main.runtimeClasspath.files*.name
        ['llama-', 'jackson-core-', 'jackson-databind-', 'jackson-annotations-', 'jspecify-'].each { prefix ->
            if (!runtime.any { it.startsWith(prefix) && it.endsWith('.jar') })
                throw new GradleException("Missing IntelliJ embedded runtime dependency: ${prefix}")
        }
        if (runtime.any { it.startsWith('logback-') })
            throw new GradleException('Embedded runtime must not override Minecraft logging with Logback')
        logger.lifecycle('Client/server/data-generation embedded paths, IntelliJ XML and JNI classpath verified (no model inference)')
    }
}
tasks.named('check') { dependsOn tasks.named('verifyEmbeddedLaunchConfiguration') }

// Opt-in forward inference with exactly the embedding options used by the Loom client.
// The child changes cwd like IntelliJ's Minecraft launch; no weights enter build/check.
tasks.register('embeddedIntellijInferenceProbe', JavaExec) {
    group = 'verification'
    description = 'Run real embedded inference from an unrelated cwd using Loom client embedding options.'
    dependsOn tasks.named('runtimeTestClasses'), tasks.named('verifyEmbeddedLaunchConfiguration')
    classpath = sourceSets.runtimeTest.runtimeClasspath
    mainClass = 'io.github.mysticism.embedding.EmbeddedIntellijInferenceProbe'
    enableAssertions = true
    doFirst {
        setArgs(loom.runs.client.vmArgs.findAll { it.startsWith('-Dmysticism.embedding.') })
    }
}

// Loom replaces the Java publication's dev artifact with remapJar.
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
